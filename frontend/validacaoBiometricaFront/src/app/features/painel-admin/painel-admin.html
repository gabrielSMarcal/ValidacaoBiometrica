<main class="page-panel admin-panel" id="main-content" aria-labelledby="admin-title">
  <header class="admin-header">
    <div>
      <p class="eyebrow">Área administrativa</p>
      <h1 id="admin-title">Painel do administrador</h1>
      <p class="admin-intro">Bem-vindo ao painel administrativo da aplicação.</p>
    </div>
    <span class="admin-badge">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8.3 7 10 4-1.7 7-5.5 7-10V6l-7-3Z" /><path d="m9 12 2 2 4-4" /></svg>
      Administrador
    </span>
  </header>

  <div class="admin-actions" aria-label="Ações administrativas">
    <a class="admin-action" routerLink="/cadastro-usuario">
      <span class="admin-action__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="10" cy="8" r="3.5" /><path d="M3.5 20a6.5 6.5 0 0 1 13 0M19 8v6M16 11h6" /></svg>
      </span>
      <strong>Cadastrar usuário</strong>
      <span>Crie um usuário e registre a biometria pela câmera.</span>
      <span class="admin-action__cta" aria-hidden="true">Abrir <span>→</span></span>
    </a>
    <a class="admin-action" routerLink="/gerenciamento-usuarios">
      <span class="admin-action__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3" /><path d="M3.5 19a5.5 5.5 0 0 1 11 0M16 5.5a3 3 0 0 1 0 5.5M17.5 14.5a5 5 0 0 1 3 4.5" /></svg>
      </span>
      <strong>Gerenciar usuários</strong>
      <span>Consulte, edite, ative ou remova usuários cadastrados.</span>
      <span class="admin-action__cta" aria-hidden="true">Abrir <span>→</span></span>
    </a>
  </div>

  <a class="back-link" routerLink="/">Voltar para o início</a>
</main>
