<div class="login">
  <h1 id="login-title">Acesso ao sistema</h1>
  <p>Informe suas credenciais. Na próxima etapa, a identidade será confirmada pela câmera.</p>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" aria-labelledby="login-title">
    <label for="cpf">CPF</label>
    <input
      id="cpf"
      type="text"
      formControlName="cpf"
      autocomplete="username"
      inputmode="numeric"
      aria-describedby="cpf-help"
    />
    <small id="cpf-help">Digite o CPF com ou sem pontuação.</small>

    <label for="senha">Senha</label>
    <input
      id="senha"
      type="password"
      formControlName="senha"
      autocomplete="current-password"
    />

    @if (errorMessage()) {
      <p class="login-error" role="alert">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="form.invalid || submitting()">
      {{ submitting() ? 'Validando…' : 'Continuar' }}
    </button>
  </form>
</div>
