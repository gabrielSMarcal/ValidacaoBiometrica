<header class="navbar">
  <div class="navbar-inner">
    <a class="brand" href="#top" (click)="closeMenu()">
      <span class="brand-kicker">Governo Federal</span>
      <span class="brand-name">Ministério do Meio Ambiente e Mudança do Clima</span>
    </a>

    <nav class="desktop-nav" aria-label="Principal">
      @for (link of links; track link.href) {
        <a [href]="link.href">{{ link.label }}</a>
      }

      <a routerLink="/login" (click)="closeMenu()">Área Restrita</a>
    </nav>

    <button
      class="menu-button"
      type="button"
      aria-controls="mobile-navigation"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <span class="menu-button-label">Menu</span>
      <span aria-hidden="true">{{ menuOpen() ? 'Fechar' : 'Abrir' }}</span>
    </button>
  </div>

  @if (menuOpen()) {
    <nav id="mobile-navigation" class="mobile-nav" aria-label="Menu móvel">
      @for (link of links; track link.href) {
        <a [href]="link.href" (click)="closeMenu()">{{ link.label }}</a>
      }

      <a routerLink="/login" (click)="closeMenu()">Área Restrita</a>
    </nav>
  }
</header>
